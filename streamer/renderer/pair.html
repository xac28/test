<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYA Yayın Stüdyosu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2684a"/><stop offset="1" stop-color="#f2bb3a"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="#17433f"/>
      <g fill="url(#g)">
        <path d="M32 11c5 7 7 13 7 19s-3 12-7 15c-4-3-7-9-7-15s2-12 7-19z"/>
        <path d="M13 24c8 1 14 4 18 9 3 4 4 9 3 13-5 0-11-2-15-6-4-4-6-10-6-16z" opacity=".85"/>
        <path d="M51 24c-8 1-14 4-18 9-3 4-4 9-3 13 5 0 11-2 15-6 4-4 6-10 6-16z" opacity=".85"/>
      </g>
      <path d="M14 51h36" stroke="#fbf6ee" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    </svg>
    <span>AYA</span>
  </div>
  <h1>Yayın Stüdyosu</h1>
  <p>Bilgisayarını hesabına bağlamak için web sitesindeki <strong style="color:var(--text)">Yayın uygulaması</strong> sayfasından aldığın kodu yaz.</p>
  <form id="form" autocomplete="off">
    <label for="code">Bağlantı kodu</label>
    <input id="code" class="code" maxlength="9" placeholder="XXXX-XXXX" spellcheck="false" autofocus>
    <details>
      <summary>Gelişmiş: sunucu adresi</summary>
      <label for="server">AYA sunucusu</label>
      <input id="server" placeholder="https://aya.ornek.com" spellcheck="false">
    </details>
    <div id="error" class="error" role="alert" hidden></div>
    <button id="go" type="submit"><span id="go-label">Bağla</span></button>
  </form>
  <p class="small">Şifreni bu uygulamaya yazman gerekmez. Kod 10 dakika geçerlidir ve yalnızca bir kez kullanılır.</p>
</main>
<script src="pair.js"></script>
</body>
</html>
